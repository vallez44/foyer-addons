name: Foyer
version: "0.2.0"
slug: foyer
url: https://github.com/vallez44/foyer-addons
description: >-
  Tableau de bord mural pour iPad : 10 cadrans (photos, horloges, météo, agenda,
  caméras et grandes tuiles pour la maison), sur l'iPad que vous avez déjà.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8110
panel_icon: mdi:tablet-dashboard
panel_title: Foyer
homeassistant_api: true
hassio_api: true
map:
  - type: media
    read_only: false
ports:
  8110/tcp: 8110
ports_description:
  8110/tcp: >-
    Accès direct : Foyer en plein écran sur l'écran d'accueil de l'iPad, et les anciens iPad
    qui n'ouvrent pas Home Assistant. Chaque écran s'associe une fois avec un code.
options:
  direct_access: true
  pairing_code: ""
  allowed_hosts: ""
  sensitive_from_ha_only: false
schema:
  direct_access: bool
  pairing_code: match(^([0-9]{8,12})?$)
  allowed_hosts: str?
  sensitive_from_ha_only: bool
